# Link masses for sim/urdf/cobot30_5.urdf (design 5.8). Applied by tools/fix_urdf_inertia.py to
# sim/urdf/cobot30_5_original.urdf (SolidWorks export at the default 1000 kg/m^3 density).
# Inertia tensors are scaled by mass_kg / original mass (uniform-density assumption), centres
# of mass are unchanged. Volumes are signed-tetrahedron volumes of sim/meshes/*.STL.
mesh_package: cobot_sim
sources:
  erob: "ZeroErr eRob parameter table v2.0 (H series): eRob70H 0.92 kg, eRob90H 1.98 kg, eRob110H 3.18 kg; meshes are T (hollow) variants, which are heavier"
  aluminium: "6061 aluminium 2.70 g/cm^3"
links:
  base_link: {mass_kg: 1.356, source: "flange, aluminium, 502.3 cm^3"}
  link_1: {mass_kg: 3.180, source: "eRob110H"}
  link_2: {mass_kg: 3.180, source: "eRob110H"}
  link_3: {mass_kg: 4.177, source: "eRob90H 1.98 + Link_23 tube aluminium 813.6 cm^3 (link_3 - link_4 volume)"}
  link_4: {mass_kg: 1.980, source: "eRob90H"}
  link_5: {mass_kg: 2.469, source: "eRob70H 0.92 + Link_45 tube aluminium 573.7 cm^3 (link_5 - link_6 volume)"}
  link_6: {mass_kg: 0.920, source: "eRob70H"}
  link_6_2: {mass_kg: 0.920, source: "eRob70H"}
  link_7: {mass_kg: 0.227, source: "end effector, aluminium, 84.0 cm^3"}
# eRob ratio 100 joint limits (realism-2 design G1 and section 5), written into every revolute
# joint's <limit>: effort is the momentary torque M (the plant's hard cap; the controller uses the
# peak torque P of config/default.yaml `limits`), velocity is the output speed. This also replaces
# the 870 N m effort typos of the export (joint_2, joint_4).
joint_limits:
  source: "ZeroErr eRob ratio 100 datasheet: eRob110H R/P/M 87/204/369 N m, eRob90H 52/107/191, eRob70H 10/36/70; velocity: 20-30 rpm, awaiting the H-series datasheet"
  joints:
    joint_1: {effort_nm: 369.0, velocity_rad_s: 2.1, source: "eRob110H"}
    joint_2: {effort_nm: 369.0, velocity_rad_s: 2.1, source: "eRob110H"}
    joint_3: {effort_nm: 191.0, velocity_rad_s: 2.1, source: "eRob90H"}
    joint_4: {effort_nm: 191.0, velocity_rad_s: 2.1, source: "eRob90H"}
    joint_5: {effort_nm: 70.0, velocity_rad_s: 3.1, source: "eRob70H"}
    joint_6: {effort_nm: 70.0, velocity_rad_s: 3.1, source: "eRob70H"}
    joint_7: {effort_nm: 70.0, velocity_rad_s: 3.1, source: "eRob70H"}
damping_nm_s_rad: 0.003
# Reflected rotor inertia per revolute joint, armature = J_in * N^2 (kg m^2), written by
# tools/fix_urdf_inertia.py as <cobot_armature value="..."/>. 1 g mm^2 = 1e-9 kg m^2.
armature:
  status: "assumed until the eRob H-series datasheet values are confirmed (ADR-005 open item)"
  gear_ratio: 100
  gear_ratio_source: "assumed common eRob strain-wave ratio; the series offers 50/80/100/120"
  joints:
    joint_1: {input_inertia_g_mm2: 308632, source: "eRob110I strain-wave-gear input inertia, reseller listing of the ZeroErr table"}
    joint_2: {input_inertia_g_mm2: 308632, source: "eRob110I strain-wave-gear input inertia, reseller listing of the ZeroErr table"}
    joint_3: {input_inertia_g_mm2: 100000, source: "assumed eRob90 value between the eRob70 and eRob110 values; replace with the datasheet"}
    joint_4: {input_inertia_g_mm2: 100000, source: "assumed eRob90 value between the eRob70 and eRob110 values; replace with the datasheet"}
    joint_5: {input_inertia_g_mm2: 22674, source: "eRob70I input inertia, lower of the listed configurations, ZeroErr product table"}
    joint_6: {input_inertia_g_mm2: 22674, source: "eRob70I input inertia, lower of the listed configurations, ZeroErr product table"}
    joint_7: {input_inertia_g_mm2: 22674, source: "eRob70I input inertia, lower of the listed configurations, ZeroErr product table"}
