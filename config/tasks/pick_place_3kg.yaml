# Pick and place with a 3 kg part (feature hardware-catalog, ADR-023; schema in docs/conventions.md
# "Task file"). The part is a solid sphere 5 cm along the tip z axis, and the controller is told it.
# Thresholds: proposed, awaiting owner approval (question C13). final_pos_err_m, final_rot_err_deg and
# rms_joint_err_rad are the E2E-12 levels; cycle_time_s is the settle time of the waypoint path.
task:
  name: pick_place_3kg
  waypoints: pick_place_waypoints.yaml   # relative to this file
  payload:
    kg: 3.0
    offset_m: [0.0, 0.0, 0.05]           # m, in the tip frame
    radius_m: 0.05                       # m
    known: true
  requirements:
    final_pos_err_m: 0.005
    final_rot_err_deg: 2.0
    rms_joint_err_rad: 0.02
    cycle_time_s: 15.0                   # s, the run lasts 11.9 s (11901 rows at 1 kHz); verify measures it
    max_hold_rate: 0.05
    target_pass_rate: 0.95
    margin_frac: 0.2
