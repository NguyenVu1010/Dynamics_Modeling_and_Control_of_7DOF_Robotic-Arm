# Realism-2 mid-tier sweep (design 7): one param at a time on the mid_kr1205 profile, every other
# key at the profile's value, for each seed. sensor.position_source is not sweepable (motor).
# Run with the profile's controller config: cobot_bench sweep --config config/mid_kr1205.yaml
base_profile: config/imperfections/mid_kr1205.yaml
seeds: [1, 2, 3]
params:
  - name: transmission.lost_motion_rad
    levels: [0, 2.9e-4, 8.7e-4, 1.7e-3]
  - name: transmission.error_amp_rad
    levels: [0, 4.4e-4, 8.7e-4, 1.7e-3]
  - name: actuator.torque_slew_nm_s
    levels: [1.0e4, 2.0e4, 5.0e4, 1.0e5]
  - name: model.payload_kg
    levels: [0, 1, 3, 5]
