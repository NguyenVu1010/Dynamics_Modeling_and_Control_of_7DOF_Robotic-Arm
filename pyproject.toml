[project]
name = "cobot-tools"
version = "0.1.0"
description = "Python tooling for the 7-DOF arm: URDF fixes, e2e runner, evaluation and reports. Never links against core."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
eval = ["matplotlib>=3.8", "pandas>=2.2"]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/eval", "tools", "tests/python"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
# cobot_eval is imported like an installed package (pytest pythonpath), so it sorts with
# third-party imports everywhere; listing it keeps the order the same on every ruff version.
known-third-party = ["launch", "launch_ros", "cobot_eval"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src/eval", "tools"]
