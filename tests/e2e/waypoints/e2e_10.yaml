# E2E-10 waypoint list (feature bench-waypoints, design 2026-10-29 section 6.6 and 7).
# Four tip poses in base_link on the MVP straight line from the home tip
# p0 = (0.1100, -0.8070, 0.3891), rpy ~ (0, -90, 90) deg to the MVP goal
# p1 = (-0.5, -0.6, 0.9), rpy (0, 0, 90) deg, at s = 0.3, 0.55, 0.8 and 1.0 of the way
# (position p0 + s (p1 - p0), rotation on the geodesic: only the pitch changes, -90 + 90 s deg).
# The path is the one E2E-01/02 already track, so every point is reachable away from the joint
# limits. Waypoint 1 stops; auto (0) and user durations alternate.
frame: base_link
waypoints:
  - {position_m: [-0.0730, -0.7449, 0.5424], rpy_deg: [0.0, -63.0, 90.0], duration_s: 0, stop: false}
  - {position_m: [-0.2255, -0.6931, 0.6701], rpy_deg: [0.0, -40.5, 90.0], duration_s: 3.0, stop: true}
  - {position_m: [-0.3780, -0.6414, 0.7978], rpy_deg: [0.0, -18.0, 90.0], duration_s: 0, stop: false}
  - {position_m: [-0.5000, -0.6000, 0.9000], rpy_deg: [0.0, 0.0, 90.0], duration_s: 3.5, stop: true}
