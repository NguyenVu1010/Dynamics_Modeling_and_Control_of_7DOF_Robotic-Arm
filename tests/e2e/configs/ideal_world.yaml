# config/default.yaml with friction compensation switched off, for the scenarios on the ideal
# profile (E2E-01, E2E-07). The ideal plant has no friction, so compensating would inject a
# disturbance. Only friction_compensation.enabled and the relative paths differ from default.yaml.
cobot:
  urdf_path: ../../../src/sim/urdf/cobot30_5.urdf
  base_link: base_link
  tip_link: link_7
  gravity_b: [0.0, 0.0, -9.80665]
  control_rate_hz: 1000.0
  deterministic: true
  home_q_deg: [0.0, 30.0, 0.0, -90.0, 0.0, 60.0, 0.0]
  trajectory:
    goal_position_m: [-0.5, -0.6, 0.9]
    goal_rpy_deg: [0.0, 0.0, 90.0]
    duration_s: 10.0
    hold_s: 2.0
  clik:
    kp: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
    kd: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]
    k_null: 1.0
    k_damp: 2.0
    lambda_max: 0.05
    cond_threshold: 100.0
  computed_torque:
    kp: [6400.0, 6400.0, 6400.0, 6400.0, 6400.0, 6400.0, 6400.0]
    kd: [160.0, 160.0, 160.0, 160.0, 160.0, 160.0, 160.0]
  friction_compensation:
    enabled: false
    coulomb_nm: [1.36, 1.36, 1.36, 1.36, 0.192, 0.192, 0.192]
    viscous_nm_s_rad: [0.4, 0.4, 0.4, 0.4, 0.08, 0.08, 0.08]
    velocity_eps_rad_s: 0.01
  safety:
    soft_margin_deg: 3.0
    hal_timeout_ms: 5.0
  log:
    output_dir: ../../../results
  command_source: config
  cartesian_limits:
    v_max_m_s: 0.25
    a_max_m_s2: 0.5
    w_max_rad_s: 0.8
    alpha_max_rad_s2: 1.6
  stop_time_s: 0.5
  manual:
    joint_a_max_rad_s2: [15.0, 7.5, 12.5, 12.5, 15.0, 20.0, 20.0]
    tcp_v_max_m_s: 0.25
    tcp_w_max_rad_s: 1.0
    tcp_a_max_m_s2: 0.5
    tcp_alpha_max_rad_s2: 2.0
    deadman_ms: 100.0
    jog_margin_deg: 2.0
  tcp_offset:
    position_m: [0.0, 0.0, 0.0]
    rpy_deg: [0.0, 0.0, 0.0]
  path_validation:
    reach_pos_m: 0.001
    reach_rot_deg: 0.5
    joint_margin_deg: 2.0
    torque_ratio: 0.9
    max_stretch: 3.0
  limits:
    rated_torque_nm: [87, 87, 52, 52, 10, 10, 10]
    peak_torque_nm: [204, 204, 107, 107, 36, 36, 36]
  deflection_comp:                     # same as default.yaml; inactive here (link encoder)
    enabled: true
    stiffness_k1_nm_rad: [31000, 31000, 13000, 13000, 4700, 4700, 4700]
    stiffness_k2_nm_rad: [50000, 50000, 25000, 25000, 6100, 6100, 6100]
    stiffness_k3_nm_rad: [57000, 57000, 29000, 29000, 7100, 7100, 7100]
    torque_t1_nm: [14, 14, 7, 7, 2, 2, 2]
    torque_t2_nm: [48, 48, 25, 25, 6.9, 6.9, 6.9]
