# E2E-10 (feature bench-waypoints, design 2026-10-29 section 7): `cobot_bench run --waypoints`
# with four points from home (waypoint 1 stops, auto and user durations mixed), realistic profile,
# seed 7. E2E-02 thresholds plus the tip position error at every stop waypoint (measured 0.2 s
# after its node time) <= 5 mm. Paths are relative to the repo root.
id: E2E-10
tags: [pr, arm64]
runner: bench
kind: run
config: config/default.yaml
imperfections: config/imperfections/realistic.yaml
seed: 7
waypoints: tests/e2e/waypoints/e2e_10.yaml
thresholds:
  final_pos_err_m: 0.005
  final_rot_err_deg: 2.0
  rms_joint_err_rad: 0.02
  stop_pos_err_m: 0.005
