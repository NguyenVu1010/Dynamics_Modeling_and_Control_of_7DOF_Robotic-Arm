# E2E-12 (feature profiles, realism-2 design G3, G4, 4.6 and 10): the E2E-01 trajectory on each of
# the three reference profiles, seeds 1, 2, 3 (seed = first seed, runs = seeds per profile).
# kind profiles: for each profile, in this order, `cobot_bench montecarlo --config <config>
# --imperfections <imperfections> --runs <runs> --seed0 <seed> --out <out>/E2E-12/<name>`, which
# writes <out>/E2E-12/<name>/summary.csv; every run is judged from the metric columns against the
# profile's thresholds. hold: fail -> any held run fails the profile. hold: report -> runs held with
# hold_reason state_timeout are counted in the profile's hold rate (printed, never failed: at servo
# 250 Hz one lost packet exceeds hal_timeout 5 ms, design 4.6) and not judged on the thresholds;
# a hold with any other reason fails. Tag realism2: run with --tag realism2 or --scenario; a plain
# --all skips it.
#
# Thresholds: proposed, awaiting owner approval (design 10). Measured before the implementation
# (bench release build, the design section 7 values, config/default.yaml, seeds 1-3):
#   premium_fr3   final_pos_err_m 2.54e-3 / 2.68e-3 / 6.1e-4, final_rot_err_rad 3.1e-3 / 3.3e-3 /
#                 1.3e-3 (max 0.19 deg), rms_joint_err_rad 9.6e-4 / 9.6e-4 / 9.9e-4, no hold;
#   mid_kr1205    final_pos_err_m 2.06e-3 / 4.60e-3 / 1.01e-2, final_rot_err_rad 7.2e-3 / 6.1e-3 /
#                 1.83e-2 (max 1.05 deg), rms_joint_err_rad 8.5e-3 / 5.7e-3 / 1.01e-2, no hold;
#   budget_xarm7  every seed held: overspeed at 0.243 s and 0.222 s (seeds 1, 2), state_timeout at
#                 0.097 s (seed 3).
# On premium and mid the post-goal joint error keeps a ~60 Hz oscillation (peak-to-peak up to
# 2e-3 rad on premium, 1.5e-2 rad on mid joint 4, torque at P about half the time); with no
# sensor/command delay, or a rigid transmission, it is gone. The proposal is the E2E-02 level for
# all three; mid seed 3 is over it until that oscillation is resolved.
id: E2E-12
tags: [realism2]
runner: bench
kind: profiles
config: config/default.yaml
seed: 1
runs: 3
profiles:
  premium_fr3:
    imperfections: config/imperfections/premium_fr3.yaml
    hold: fail
    thresholds:  # proposed, awaiting owner approval
      final_pos_err_m: 0.005
      final_rot_err_deg: 2.0
      rms_joint_err_rad: 0.02
  mid_kr1205:
    imperfections: config/imperfections/mid_kr1205.yaml
    hold: fail
    thresholds:  # proposed, awaiting owner approval
      final_pos_err_m: 0.005
      final_rot_err_deg: 2.0
      rms_joint_err_rad: 0.02
  budget_xarm7:
    imperfections: config/imperfections/budget_xarm7.yaml
    hold: report
    thresholds:  # proposed, awaiting owner approval
      final_pos_err_m: 0.005
      final_rot_err_deg: 2.0
      rms_joint_err_rad: 0.02
