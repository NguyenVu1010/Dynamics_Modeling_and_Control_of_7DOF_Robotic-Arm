# E2E-07 (design 11.3): headless Gazebo, the real cobot_ros2/CobotController through
# gz_ros2_control, MVP trajectory, ideal profile, G3 thresholds. Run by tools/run_e2e.py only
# with --tag gazebo (CI job `gazebo`). Paths are relative to the repo root.
id: E2E-07
tags: [gazebo]
runner: gazebo
kind: run
config: tests/e2e/configs/ideal_world.yaml  # default.yaml without friction compensation
imperfections: config/imperfections/ideal.yaml
seed: 1
thresholds:
  final_pos_err_m: 0.002
  final_rot_err_deg: 1.0
  rms_joint_err_rad: 0.01
