# E2E-09 (feature gazebo-realism): headless Gazebo, the real cobot_ros2/CobotController through
# gz_ros2_control, MVP trajectory, realistic profile (sensor, actuator and model mismatch through
# the controller, friction in the physics), seed 7, E2E-02 thresholds. Run by tools/run_e2e.py
# only with --tag gazebo (CI job `gazebo`). Paths are relative to the repo root.
id: E2E-09
tags: [gazebo]
runner: gazebo
kind: run
config: config/default.yaml  # friction compensation on
imperfections: config/imperfections/realistic.yaml
seed: 7
thresholds:
  final_pos_err_m: 0.005
  final_rot_err_deg: 2.0
  rms_joint_err_rad: 0.02
