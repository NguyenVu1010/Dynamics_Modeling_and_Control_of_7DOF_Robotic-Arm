name: arm64
# E2E-08 (ADR-016, ADR-017): the Pi5-like image under QEMU. Not a required check until the Pi 5
# work starts. Runs nightly, by hand, and on PRs with the label arm64.
on:
  schedule:
    - cron: "0 20 * * *"   # 03:00 Vietnam time, after nightly
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'arm64')
    runs-on: ubuntu-24.04
    # QEMU emulation: the image took 71 min on #58, 1h50 on #70 and hit the 150 min limit on #72.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - name: Build and test in the Pi5-like image (E2E-08)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pi5.Dockerfile
          platforms: linux/arm64
          target: test
          cache-from: type=gha,scope=pi5
          cache-to: type=gha,mode=max,scope=pi5
