name: ci
# Required checks for main (ADR-016): every job below, plus frozen-tests (frozen-tests.yml). Jobs
# whose subject does not exist yet (no e2e scenarios, no ros2_node) still run and pass, so the
# required list never changes. arm64 lives in arm64.yml and is not required until the Pi 5 work.
# No labeled/unlabeled here: a label would cancel a running job and restart all of them.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_APT: cmake ninja-build g++ libeigen3-dev libgtest-dev libgmock-dev libtinyxml2-dev libyaml-cpp-dev
  # cobot_studio (ADR-021): only the core and lint jobs build it; the 3D view test runs under
  # xvfb-run with Mesa's software OpenGL.
  STUDIO_APT: qtbase5-dev libqt5charts5-dev qt3d5-dev xvfb libgl1-mesa-dri

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: sudo apt-get update && sudo apt-get install -y $CORE_APT $STUDIO_APT clang-format-18 clang-tidy-18
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' ':!third_party/**' | xargs -r clang-format-18 --dry-run --Werror
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff>=0.6"
      - run: ruff check . && ruff format --check .
      - name: clang-tidy on changed C++ files
        if: github.event_name == 'pull_request'
        run: |
          # COBOT_BUILD_STUDIO puts src/studio/app/*.cpp in compile_commands.json (Qt includes).
          cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release -DCOBOT_BUILD_STUDIO=ON
          # ros2_node and ros2_gui need the ROS headers: the gazebo job runs clang-tidy on them (sim.sh tidy).
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- '*.cpp' ':!src/ros2_node/**' ':!src/ros2_gui/**' ':!third_party/**')
          if [ -n "$files" ]; then clang-tidy-18 -p build --quiet --warnings-as-errors='*' $files; fi

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $CORE_APT $STUDIO_APT
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOBOT_WERROR=ON -DCOBOT_BUILD_STUDIO=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure --parallel 4

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $CORE_APT
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCOBOT_WERROR=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - run: cmake --build build --parallel 4
      # The tests excluded here re-run whole bench scenarios to compare results and take 33 to 79 min
      # each under Debug + ASan (3h14 job on #65). They still run in core and coverage. ctest names
      # of parameterised tests end in "  # GetParam() = ...", so those alternatives end in a space.
      - run: >
          ctest --test-dir build --output-on-failure --parallel 4 --exclude-regex
          "OverridesRerun\.WrittenPairGivesTheSameRunCsvBytes/(premium_fr3|budget_xarm7|mid_kr1205) |StudioRun\.OverrideEqualToTheFileGivesTheSameSummary$|LogChannelsBench\.MidTierMotorEncoderShowsDeflectionAndTheCompensation$|BridgeService\.UnreachableMoveTcpIsRejectedWithTheIssuesOfPlanTcpMove$|ManualPlan\.TcpMoveUnreachableMatchesValidatePath$"

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $CORE_APT gcovr
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCOBOT_COVERAGE=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Line coverage of src/core/ >= 80 %
        run: >
          mkdir -p coverage &&
          gcovr --root . --filter 'src/core/' --exclude-unreachable-branches
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
          --print-summary --fail-under-line 80
          --html-details coverage/index.html --xml coverage/coverage.xml build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage }

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,eval]"
      - run: pytest

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y $CORE_APT
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[eval]"
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOBOT_WERROR=ON -DCOBOT_BUILD_TESTS=OFF
      - run: cmake --build build --parallel 4
      - name: E2E-01..04 and PF-01 (bench, design 11.3)
        run: |
          if ls tests/e2e/scenarios/*.yaml >/dev/null 2>&1; then
            python tools/run_e2e.py --all --tag pr --bench build/src/bench/cobot_bench --out results/ci-${{ github.run_id }}
          else
            echo "no e2e scenarios yet"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-results, path: results, if-no-files-found: ignore }

  gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ros.Dockerfile
          tags: cobot-ros:ci
          load: true
          cache-from: type=gha,scope=ros
          cache-to: type=gha,mode=max,scope=ros
      - name: colcon build, asset check, smoke and gazebo E2E-07/09/11/11b in ROS 2 Jazzy + Gazebo Harmonic
        run: >
          docker run --rm --shm-size=512m -v ${{ github.workspace }}:/repo -w /repo cobot-ros:ci
          bash tools/ci/gazebo_ci.sh
